[project]
name = "fomo"
version = "0.1.0"
description = "Backtest a 200-day SMA trend filter on leveraged ETFs (TQQQ / UPRO / QLD / SSO)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bt>=1.1.0",
    "yfinance>=0.2.50",
    "quantstats>=0.0.64",
    "pandas>=2.1,<3",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "streamlit>=1.35",
    "plotly>=5.20",
]

[project.scripts]
fomo-backtest = "fomo.run_backtest:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fomo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
